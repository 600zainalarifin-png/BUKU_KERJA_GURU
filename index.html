<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kerja Guru Digital - MI & MTs Darul Falah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mi: { 50: '#ecfdf5', 600: '#059669', 700: '#047857' },
                        mts: { 50: '#eff6ff', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            @page {
                size: 210mm 330mm; /* Standar Ukuran Kertas F4 / Folio */
                margin: 12mm 15mm;
            }
            body {
                background: white !important;
                color: black !important;
                font-size: 10pt;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
        }
        .print-only {
            display: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans transition-colors duration-200">

    <!-- HEADER & NAVBAR -->

            <div class="flex items-center space-x-3">

                    MI
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight flex items-center gap-2">
                        Buku Kerja Guru Digital
                        <span id="inst-label" class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">MI Darul Falah</span>
                    </h1>
                    <p id="teacher-subtitle" class="text-xs text-slate-500">Achmad Zainal Arifin, S.Pd. | 2026/2027</p>
                </div>
            </div>

            <div class="flex items-center flex-wrap gap-2">
                <!-- Institution Switcher -->
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-semibold">
                    <button id="btn-switch-mi" onclick="window.setInstitution('MI')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white shadow-sm transition">
                        MI Darul Falah
                    </button>
                    <button id="btn-switch-mts" onclick="window.setInstitution('MTS')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        MTs Darul Falah
                    </button>
                </div>

                <!-- Global Search Input -->
                <div class="relative">
                    <input type="text" id="global-search" oninput="window.handleGlobalStudentSearch(this.value)" placeholder="Cari siswa..." class="text-xs pl-8 pr-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-36 sm:w-48 bg-slate-50">
                    <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <!-- Search Dropdown Results -->
                    <div id="search-results-dropdown" class="hidden absolute right-0 mt-1 w-64 bg-white rounded-xl shadow-xl border border-slate-200 z-50 max-h-60 overflow-y-auto p-1 text-xs"></div>
                </div>

                <!-- Theme Toggle & Settings -->
                <button onclick="window.toggleDarkMode()" title="Mode Gelap" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600">🌙</button>
                <button onclick="window.openSettingsModal()" title="Pengaturan & Backup" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">⚙️</button>
            </div>
        </div>

        <!-- Horizontal Nav Tabs -->
        <div class="max-w-7xl mx-auto px-4 overflow-x
